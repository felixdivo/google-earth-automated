[project]
name = "google-earth-automated"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Felix Divo", email = "felix.divo@tu-darmstadt.de" }]
dependencies = ["rich>=13", "playwright>=1.47,<2"]

[project.scripts]
esp-builder = "esp_builder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src/*.py"]
sources = ["src"]
