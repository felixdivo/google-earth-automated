[project]
name = "google-earth-automated"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Felix Divo", email = "felix.divo@tu-darmstadt.de" }]
dependencies = ["rich>=13", "playwright>=1.47,<2"]

[project.scripts]
esp-builder = "google_earth_automated.esp_builder:main"
studio-login = "google_earth_automated.studio_login:main"
studio-render = "google_earth_automated.studio_render:main"
studio-gpu-check = "google_earth_automated.gpu_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.16.5"]

[tool.ruff]
# Matches the width the code was already written to; the default 88 would split
# the geodesy math in esp_builder.py mid-expression.
line-length = 100
