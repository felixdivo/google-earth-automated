[project]
name = "google-earth-automated"
version = "0.1.0"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Felix Divo", email = "felix.divo@tu-darmstadt.de" }]
dependencies = ["rich>=13", "playwright>=1.47,<2", "typer>=0.15,<1"]

[project.scripts]
earth = "google_earth_automated.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.16.5"]

[tool.ruff]
line-length = 100
